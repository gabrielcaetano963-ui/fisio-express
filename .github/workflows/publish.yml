name: Publicar Planilhas Fisio
on:
  push:
    branches: [planilhas-fisio-publicacao]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: planilhas-fisio-producao
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Conferir arquivos e credencial
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_PLANILHAS_API_TOKEN }}
        run: |
          test -s index.html
          test -s assets/index-checkout-perfectpay.js
          grep -q "940829541718246" index.html
          grep -q "PPU38CQHAKP" assets/index-checkout-perfectpay.js
          if [ -z "$CF_TOKEN" ]; then
            echo "Configure o segredo CLOUDFLARE_PLANILHAS_API_TOKEN para habilitar a publicacao."
            exit 1
          fi
      - name: Preparar somente arquivos publicos
        run: |
          mkdir -p /tmp/planilhas-publicar
          cp index.html _redirects *.png /tmp/planilhas-publicar/
          cp -R assets /tmp/planilhas-publicar/assets
      - name: Publicar no projeto existente
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PLANILHAS_API_TOKEN }}
          accountId: 8e215853c9504ada5e4320d4e28c280b
          command: pages deploy /tmp/planilhas-publicar --project-name=planilhas-fisio --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
